<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c0ff00'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0e" />
    <title>OneWebUI — Design System & Component Library</title>

    <!-- Wix Madefor Display Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Rounded with variable font axes (FILL: 1) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Chunk load error recovery for SPAs -->
    <script>
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[OneWebUI] Vite preload error, reloading with fresh cache...', event);
        window.location.reload();
      });
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'oneweb_chunk_reload_' + (e.target.src || e.target.href);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            console.warn('[OneWebUI] Asset load failed, auto-reloading page...', e.target);
            window.location.reload();
          }
        }
      }, true);
    </script>
    <style>
      @keyframes oneweb-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#090b0e] text-white font-sans antialiased min-h-screen selection:bg-[#c0ff00] selection:text-[#090b0e]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090b0e; color: #8e8e93; font-family: 'Wix Madefor Display', -apple-system, BlinkMacSystemFont, sans-serif;">
        <div style="width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #c0ff00; border-radius: 50%; animation: oneweb-spin 0.75s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;">OneWebUI</div>
        <div style="font-size: 12px; color: #8e8e93; margin-top: 4px;">Загрузка дизайн-системы...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
